});
document.addEventListener('change',e=>{if(e.target.id==='preview-select')go(e.target.value);if(e.target.dataset.permission)permissions[e.target.dataset.permission]=e.target.checked;});
document.addEventListener('submit',e=>{e.preventDefault();const id=e.target.id;if(id==='auth-form'){if(current==='login'){go('dash-ai');toast('샘플 업무 화면으로 이동했습니다.')}else if(current==='signup'){modal('가입 정보 확인',`<p>${escapeHtml($('#employee-name').value)}님의 입력 정보를 확인했습니다.</p><div class="note" style="margin-top:18px">프로토타입에서는 실제 계정을 생성하지 않습니다.</div>`,`<button class="btn primary" data-go="login">로그인 화면으로</button>`)}else{modal('이메일 인증',`<p>${escapeHtml($('#email').value)}로 인증하는 화면의 예시입니다. 실제 이메일은 발송되지 않습니다.</p><form id="verify-form"><div class="field"><label for="verify-code">샘플 인증 코드</label><input id="verify-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required></div><p class="small muted" style="margin-top:10px">샘플 코드: 123456</p></form>`,`<button class="btn" data-action="modal-close">취소</button><button class="btn primary" form="verify-form">확인</button>`)}}else if(id==='verify-form'){if($('#verify-code').value!=='123456'){toast('샘플 코드 123456을 입력하세요.');return}$('#modal-body').innerHTML='<form id="reset-form"><div class="field"><label for="new-pass">새 비밀번호</label><input id="new-pass" type="password" minlength="8" autocomplete="new-password" required placeholder="8자 이상 입력"></div><div class="field"><label for="confirm-pass">새 비밀번호 확인</label><input id="confirm-pass" type="password" minlength="8" autocomplete="new-password" required></div><p class="small muted" style="margin-top:16px">실제 비밀번호는 변경되지 않습니다.</p></form>';$('#modal-actions').innerHTML='<button class="btn primary" form="reset-form">변경 확인</button>';}else if(id==='reset-form'){if($('#new-pass').value!==$('#confirm-pass').value){toast('비밀번호 확인 값이 다릅니다.');return}closeModal();go('login');toast('비밀번호 변경 화면을 확인했습니다.')}else if(id==='chat-form')sendQuestion($('#chat-input').value);else if(id==='filter-form'){const query=$('#filter-query').value.trim(),process=$('#filter-process').value;tableState.query=query;tableState.process=process;tableState.date=$('#filter-date').value;tableState.page=1;render();toast('샘플 데이터에 조회 조건을 적용했습니다.')}else if(id==='upload-form'){const f=$('#upload-file').files[0];closeModal();toast(`${f.name} · ${(f.size/1024).toFixed(1)} KB 선택 확인`)}else if(id==='record-form'){const schema=schemas[current]||schemas['sys-account'];const values=[...e.target.querySelectorAll('input:not([type="hidden"])')].map(x=>x.value);const index=$('#record-index').value;if(index===''){const row=schema.headers.slice(0,-1).map((_,i)=>values[i]||'—');savedRecords[current]||={rows:[]};savedRecords[current].rows.push(row);}else{const allRows=[...schema.rows,...(savedRecords[current]?.rows||[])];values.forEach((v,i)=>allRows[Number(index)][i]=v)};closeModal();render();toast('샘플 항목을 현재 세션에 저장했습니다.')}});
$('#modal-close').addEventListener('click',closeModal);$('#modal').addEventListener('cancel',()=>{if(lastFocus?.isConnected)setTimeout(()=>lastFocus.focus(),0)});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
$('#preview-select').innerHTML='<optgroup label="인증"><option value="login">로그인</option><option value="signup">회원가입</option><option value="forgot-password">비밀번호 찾기</option></optgroup>'+MENU.map(g=>`<optgroup label="${g.group}">${g.items.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</optgroup>`).join('')+'<optgroup label="하위 화면 · 가이드"><option value="daily-history">이전 보고서</option><option value="components">컴포넌트 가이드</option></optgroup>';
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)go(id)});go(location.hash.slice(1)||'dash-ai');
</script>
</body>
