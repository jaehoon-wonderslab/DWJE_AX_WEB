<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덕우전자 AX 리디자인</title>
<!--
  덕우전자 AX — 3차 리디자인 화면 프로토타입 (단일 파일)
  기준: docs/design/UI_REDESIGN_PROMPT.md
   · 기본 글자 15px · Pretendard + Inter · 굵기 500/600
   · 팔레트 Burgundy & Blush (#880D1E · #DD2D4A · #F26A8D · #F49CBB · #D1D5DE · #EDE3E9)
   · 메뉴 27건 + 로그인·회원가입·비밀번호 재설정 + 404 + 컴포넌트·토큰
  데이터는 전부 화면용 목(mock)입니다. 서버를 호출하지 않습니다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* =========================================================
   1. 토큰
   ========================================================= */
:root{
  --bg:#F6F1F4; --card:#FFFFFF; --muted:#FBF8FA; --secondary:#F3ECF0; --border:#E4DDE2;
  --fg:#1E1418; --fg2:#3D3237; --fg3:#7A6E74;
  --primary:#880D1E; --primary-h:#6E0A18; --accent:#DD2D4A; --spark:#F26A8D; --tint:#F49CBB; --mute:#D1D5DE;
  --success:#2E9E57; --success-bg:#EAF6EE; --warning:#E8A33D; --warning-text:#8F5B0B; --warning-bg:#FDF4E6;
  --danger:#C81E1E; --danger-bg:#FCECEC; --brand-bg:#F8E7EB; --info-bg:#F1EEF2;
  --ring:rgba(221,45,74,.35); --tint-bg:rgba(244,156,187,.14); --tint-bg-2:rgba(244,156,187,.22);
  --overlay:rgba(30,20,24,.32); --shadow:0 10px 30px rgba(136,13,30,.05); --pop-shadow:0 16px 40px rgba(30,20,24,.12),0 2px 6px rgba(30,20,24,.06);
  --s1:#880D1E; --s2:#DD2D4A; --s3:#F26A8D; --s4:#F49CBB; --s5:#8A93A6; --s6:#2E9E57;
  --ci-blue:#0033A0; --ci-sky:#00AEEF;
  --r-panel:20px; --r:14px; --r-act:12px; --r-sm:10px; --r-xs:8px;
  --gutter:16px; --sb:228px; --sb-c:64px; --top:60px; --rail:380px;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --t:160ms; --t-in:220ms; --t-out:140ms;
  --f-sans:"Pretendard Variable",Pretendard,Inter,"Apple SD Gothic Neo","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-num:Inter,"Pretendard Variable",Pretendard,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:22px;font-weight:500;word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
b,strong{font-weight:600}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
::selection{background:var(--tint-bg-2)}
.ic{flex:none;display:block}
[hidden]{display:none!important}

/* 타이포 스케일 — 기본 15px */
.t-caption{font-size:12.5px;line-height:17px;color:var(--fg3)}
.t-label{font-size:13.5px;line-height:18px;color:var(--fg3);letter-spacing:.01em}
.eyebrow{font-size:13.5px;line-height:18px;font-weight:600;color:var(--fg3);letter-spacing:.01em}
.t-xs{font-size:13px;line-height:18px}
.t-sm{font-size:14px;line-height:20px}
.t-body{font-size:15px;line-height:22px;color:var(--fg2)}
.h-card{font-size:16px;line-height:22px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.h-sec{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.015em;color:var(--fg)}
.h-page{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.h-lg{font-size:26px;line-height:32px;font-weight:600;letter-spacing:-.02em;color:var(--fg)}
.display{font-size:30px;line-height:36px;font-weight:600;letter-spacing:-.025em;color:var(--primary)}
.num{font-family:var(--f-num);font-size:26px;line-height:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--fg)}
.num-sm{font-family:var(--f-num);font-size:20px;line-height:24px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.num-t{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13.5px;line-height:20px}
.fg3{color:var(--fg3)} .fg2{color:var(--fg2)} .brand{color:var(--primary)}
.row{display:flex;align-items:center;gap:8px} .spacer{flex:1}
.wrap{flex-wrap:wrap}

/* =========================================================
   2. 공통 컴포넌트
   ========================================================= */
/* 버튼 */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:var(--r-act);font-size:15px;font-weight:600;white-space:nowrap;border:1px solid transparent;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),transform 80ms var(--ease),box-shadow var(--t) var(--ease)}
.btn:active{transform:scale(.98)}
.btn-sm{height:32px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h)}
.btn-outline{background:#fff;border-color:var(--border);color:var(--fg)}
.btn-outline:hover{background:var(--secondary);border-color:#D8CFD5}
.btn-ghost{color:var(--fg2)}
.btn-ghost:hover{background:var(--secondary);color:var(--primary)}
.btn-danger{background:#fff;border-color:#F0C9C9;color:var(--danger)}
.btn-danger:hover{background:var(--danger-bg)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.loading{color:transparent!important;pointer-events:none}
.btn.loading>*{visibility:hidden}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.btn-outline.loading::after{border-color:var(--border);border-top-color:var(--primary)}
.icon-btn{position:relative;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-sm);color:var(--fg2);transition:background-color var(--t) var(--ease),color var(--t) var(--ease)}
.icon-btn:hover{background:var(--secondary);color:var(--primary)}
.icon-btn.on{background:var(--tint-bg);color:var(--primary)}
.icon-btn.spin-on-press:active .ic{animation:spin .6s linear infinite}
.icon-btn.spinning .ic{animation:spin .6s linear infinite}
/* 링크 — 밑줄이 왼쪽에서 그려집니다 */
.lnk{color:var(--primary);font-weight:600;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size var(--t-in) var(--ease),color var(--t) var(--ease);padding-bottom:1px}
.lnk:hover{background-size:100% 1px;color:var(--accent)}

/* 배지·점 */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;background:var(--secondary);color:var(--fg2)}
.badge .ic{width:13px;height:13px}
.b-success{background:var(--success-bg);color:var(--success)}
.b-warning{background:var(--warning-bg);color:var(--warning-text)}
.b-danger{background:var(--danger-bg);color:var(--danger)}
.b-brand{background:var(--brand-bg);color:var(--primary)}
.b-line{background:#fff;border:1px solid var(--border);color:var(--fg2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute);flex:none}
.dot.live{background:var(--success);box-shadow:0 0 0 0 rgba(46,158,87,.45);animation:breath 2.4s var(--ease) infinite}
.tag-new{font-size:11.5px;line-height:16px;padding:0 6px;border-radius:999px;background:var(--brand-bg);color:var(--primary);font-weight:600}

/* 카드 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 0}
.card-head>div:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card-r{display:flex;align-items:center;gap:6px;flex:none}
.card-body{padding:14px 20px 20px}
.card.tight .card-body{padding:12px 14px 14px}
.sub-card{background:var(--muted);border-radius:var(--r-sm);padding:14px 16px}
.src-note{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;line-height:17px;color:var(--fg3)}

/* 그리드 */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-2{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stack{display:flex;flex-direction:column;gap:14px}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g-2-1,.g-1-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g2,.g4{grid-template-columns:minmax(0,1fr)}}

/* 통계 카드 */
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.stat-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--muted);color:var(--primary)}
.stat-v{display:flex;align-items:baseline;gap:4px}
.unit{font-size:14px;color:var(--fg3);font-weight:500}
.stat-bot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.drift{display:inline-flex;align-items:center;gap:2px;font-size:13.5px;line-height:18px;font-weight:600;font-family:var(--f-num)}
.drift.good{color:var(--success)} .drift.bad{color:var(--danger)}
.spark-svg path{fill:none;stroke:var(--primary);stroke-width:1.6}

/* 입력 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-size:13.5px;line-height:18px;color:var(--fg2);font-weight:600}
.req{color:var(--accent);margin-left:2px}
.inp,.sel select{height:40px;width:100%;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:#fff;font-size:15px;transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease);outline:none}
.inp::placeholder,textarea::placeholder{color:#A99EA4}
.inp:hover,.sel select:hover{border-color:#D3C9CF}
.inp:focus,.sel select:focus,textarea.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inp.sm,.sel.sm select{height:34px;font-size:14px;border-radius:var(--r-xs)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:22px}
.field.has-err .inp{border-color:var(--danger)}
.err{display:flex;align-items:center;gap:5px;font-size:13px;line-height:18px;color:var(--danger)}
.hint{font-size:13px;line-height:18px;color:var(--fg3)}
.sel{position:relative;display:block}
.sel select{appearance:none;padding-right:34px;cursor:pointer}
.sel .ic{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:42px}
.inp-wrap .eye{position:absolute;right:4px;top:3px}
.inp-ic{position:relative}
.inp-ic>.ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg3)}
.inp-ic .inp{padding-left:34px}

/* 체크·라디오·스위치 */
.chk,.rad{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;line-height:20px;user-select:none}
.chk input,.rad input{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.chk .box{width:18px;height:18px;border-radius:5px;border:1.5px solid #CFC5CB;background:#fff;display:grid;place-items:center;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),transform 120ms var(--ease);flex:none}
.chk .box svg{width:14px;height:14px}
.chk .box path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 220ms var(--ease) 40ms}
.chk input:checked+.box{background:var(--primary);border-color:var(--primary)}
.chk input:checked+.box path{stroke-dashoffset:0}
.chk:active .box{transform:scale(.9)}
.chk input:focus-visible+.box,.rad input:focus-visible+.o{box-shadow:0 0 0 3px var(--ring)}
.rad .o{width:18px;height:18px;border-radius:50%;border:1.5px solid #CFC5CB;display:grid;place-items:center;transition:border-color var(--t) var(--ease);flex:none;background:#fff}
.rad .o i{width:8px;height:8px;border-radius:50%;background:var(--primary);transform:scale(0);transition:transform 260ms var(--spring)}
.rad input:checked+.o{border-color:var(--primary)}
.rad input:checked+.o i{transform:scale(1)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:#DCD3D8;transition:background-color var(--t-in) var(--ease);flex:none}
.sw .knob{position:absolute;left:3px;top:3px;height:16px;width:16px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(30,20,24,.2);transition:left 260ms var(--spring),width 160ms var(--ease)}
.sw:active .knob{width:21px}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"] .knob{left:19px}
.sw[aria-checked="true"]:active .knob{left:14px}
.sw-row{display:flex;align-items:center;gap:10px;font-size:14px}

/* 세그먼트·탭 — 지시자가 미끄러지며 잠깐 늘어납니다 */
.seg{position:relative;display:inline-flex;align-items:center;padding:3px;border-radius:12px;background:var(--secondary);gap:2px;isolation:isolate;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg>button{position:relative;z-index:1;height:30px;padding:0 13px;border-radius:9px;font-size:14px;font-weight:600;color:var(--fg3);white-space:nowrap;transition:color var(--t) var(--ease)}
.seg>button:hover{color:var(--fg)}
.seg>button[aria-selected="true"]{color:var(--primary)}
.seg-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(30,20,24,.08),0 0 0 1px rgba(30,20,24,.03)}
.seg.ready .seg-ind{transition:left 170ms var(--ease),width 170ms var(--ease)}
.seg.line{background:none;padding:0;border-radius:0;gap:4px;border-bottom:1px solid var(--border);display:flex}
.seg.line>button{height:40px;border-radius:0;padding:0 12px;font-size:15px}
.seg.line .seg-ind{top:auto;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:none}
.seg.sm>button{height:26px;padding:0 10px;font-size:13px}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;color:var(--fg2);transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease),transform 80ms}
.chip:hover{border-color:#D3C9CF;color:var(--fg)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--tint-bg);border-color:rgba(221,45,74,.35);color:var(--primary)}
.chip .x{display:grid;place-items:center;width:18px;height:18px;margin-right:-6px;border-radius:50%;color:var(--fg3)}
.chip .x:hover{background:var(--secondary);color:var(--primary)}
.chip.enter{animation:chipIn 220ms var(--spring) both}
.chip.leave{animation:chipOut 140ms var(--ease) both}
.chip-add{border-style:dashed;color:var(--fg3)}

/* 필터 바 */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;padding:14px 16px;border:1px solid var(--border);background:#fff;border-radius:var(--r);margin-bottom:14px}
.filters .field{width:168px}
.filters .field.w-lg{width:220px}
.filters .actions{margin-left:auto;display:flex;gap:6px}
.filters .chips-line{flex-basis:100%;display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--border)}
.filters .chips-line .t-label{white-space:nowrap}
.filters .row>input[type=date]{flex:1;min-width:0}
@media (max-width:640px){.filters .field,.filters .field.w-lg{width:100%}.filters .actions{width:100%;justify-content:flex-end}}

/* 표 — 넘치면 가로 스크롤, 헤더·본문이 같은 스크롤 영역 안에서 함께 움직입니다 */
.tbl{border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden;min-width:0}
.tbl-scroll{overflow:auto;max-width:100%;overscroll-behavior:contain}
.tbl table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:14px;line-height:20px}
.tbl th{position:sticky;top:0;z-index:2;background:var(--muted);height:40px;padding:0 12px;text-align:left;font-size:13px;line-height:18px;font-weight:600;color:var(--fg2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.c,.tbl td.c{text-align:center}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--primary)}
.th-in{display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tbl th.r .th-in{flex-direction:row-reverse}
.sort-ic{display:inline-grid;opacity:0;transition:opacity var(--t),transform var(--t-in) var(--ease);color:var(--accent)}
.tbl th.sortable:hover .sort-ic{opacity:.45}
.tbl th.sorted .sort-ic{opacity:1}
.tbl th.sorted.desc .sort-ic{transform:rotate(180deg)}
.tbl td{height:42px;padding:0 12px;border-bottom:1px solid #F0EAEE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);background:#fff;transition:background-color 120ms}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--secondary)}
.tbl tbody tr.is-sel td{background:var(--tint-bg)}
.tbl tbody tr.clickable{cursor:pointer}
.tbl .sel{width:44px;text-align:center;padding:0}
.tbl .sticky-l{position:sticky;left:0;z-index:1}
.tbl th.sticky-l{z-index:3}
.tbl .sticky-l::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:var(--border)}
.tbl td.num-c{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);background:#fff;flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:4px;margin-left:auto}
.pager .seg>button{min-width:30px;padding:0 8px;font-family:var(--f-num)}
.cell-bar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cell-bar i{display:block;height:6px;border-radius:3px;background:var(--mute);width:48px;overflow:hidden}
.cell-bar i b{display:block;height:100%;background:var(--primary)}

/* 보고서 문서표(XlsTable) */
.xls-scroll{overflow:auto;border:1px solid var(--border);border-radius:var(--r-sm)}
.xls{border-collapse:collapse;font-size:13.5px;line-height:19px;min-width:100%}
.xls th,.xls td{border:1px solid #E8E1E5;padding:7px 10px;white-space:nowrap}
.xls th{background:var(--muted);font-weight:600;color:var(--fg2);font-size:13px}
.xls td{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.xls td.l{font-family:var(--f-sans);text-align:left}
.xls tr.sum td{background:#FBF4F6;font-weight:600}
.xls td.hi{color:var(--danger);font-weight:600}
.xls td.ok{color:var(--success);font-weight:600}
.xls .stk{position:sticky;left:0;background:#fff;z-index:1}
.xls th.stk{background:var(--muted)}

/* 보고서 문서 틀 */
.doc{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:28px 32px}
.doc-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--fg);margin-bottom:18px}
.approve{display:flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin-left:auto}
.approve div{width:76px;text-align:center;border-left:1px solid var(--border)}
.approve div:first-child{border-left:0}
.approve span{display:block;font-size:12.5px;color:var(--fg3);background:var(--muted);padding:3px 0;border-bottom:1px solid var(--border)}
.approve b{display:grid;place-items:center;height:44px;font-size:13px}
.approve .stamp{color:var(--primary);font-weight:600}

/* 단계 */
.steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg3);font-weight:600}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid #D8CFD5;font-size:12.5px;font-family:var(--f-num);background:#fff;transition:all var(--t-in) var(--ease)}
.step.on{color:var(--fg)} .step.on .n{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px var(--tint-bg)}
.step.done .n{background:var(--primary);border-color:var(--primary);color:#fff}
.step-line{width:28px;height:1.5px;background:#E4DDE2;border-radius:2px;position:relative;overflow:hidden}
.step-line i{position:absolute;inset:0;background:var(--primary);transform:scaleX(0);transform-origin:left;transition:transform var(--t-in) var(--ease)}
.step-line.done i{transform:scaleX(1)}

/* 진행 막대 */
.prog{height:6px;border-radius:999px;background:var(--secondary);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .45s var(--ease)}

/* 키-값 */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px}
.kv dt{color:var(--fg3)} .kv dd{margin:0;color:var(--fg);font-weight:600}

/* 피드백 */
.hint-box{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);background:var(--muted);font-size:14px;line-height:20px;color:var(--fg2)}
.hint-box .ic{margin-top:2px;color:var(--fg3)}
.alert-box{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;line-height:20px}
.alert-box.error{background:var(--danger-bg);color:var(--danger)}
.alert-box.ok{background:var(--success-bg);color:var(--success)}
.alert-box .ic{margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 16px;text-align:center;color:var(--fg2)}
.empty .em-ic{width:40px;height:40px;border-radius:50%;background:var(--secondary);display:grid;place-items:center;color:var(--fg3)}
.blind{display:inline-flex;align-items:center;gap:4px;color:var(--fg3);letter-spacing:2px}

/* 스켈레톤 */
.sk{border-radius:var(--r-sm);background:linear-gradient(90deg,#F1EAEE 0%,#F8F3F6 40%,#F1EAEE 80%) 0 0/200% 100%;animation:shimmer 1.4s linear infinite}
.sk-page{display:flex;flex-direction:column;gap:14px}

/* 아코디언 */
.acc{border-top:1px solid var(--border)}
.acc:first-child{border-top:0}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 0;text-align:left}
.acc-h .chev{margin-left:auto;color:var(--fg3);transition:transform var(--t-in) var(--ease)}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-in) var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0}
.acc-b>div>div{padding:0 0 14px}

/* 타임라인 */
.tl{position:relative;padding-left:22px;display:flex;flex-direction:column;gap:16px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--border)}
.tl-i{position:relative}
.tl-i::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--mute)}
.tl-i.on::before{border-color:var(--accent);box-shadow:0 0 0 4px var(--tint-bg)}
.tl-i.ok::before{border-color:var(--success)}
.tl-i .t{font-size:12.5px;color:var(--fg3);font-family:var(--f-num)}

/* AI 오브 — 대기 숨쉬기 · 생각 중 회전 · 완료 한 번 퍼짐 */
.orb{--s:28px;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;isolation:isolate}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#880D1E,#DD2D4A,#F26A8D,#F49CBB,#F26A8D,#880D1E);filter:blur(.4px);animation:breathe 4s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95) 0 14%,rgba(255,255,255,.35) 38%,rgba(255,255,255,0) 66%)}
.orb[data-state="thinking"]::before{animation:spin 1.4s linear infinite}
.orb[data-state="thinking"]{animation:breathe 1.2s ease-in-out infinite}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--spark);opacity:0;pointer-events:none}
.orb[data-state="done"] .ring{animation:ripple .8s var(--ease) 1}
.orb.sm{--s:18px} .orb.lg{--s:56px}
.orb canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;z-index:1}

/* =========================================================
   3. 오버레이
   ========================================================= */
#tip{position:fixed;left:0;top:0;z-index:300;pointer-events:none;max-width:280px;padding:8px 10px;border-radius:10px;background:#1E1418;color:#fff;font-size:13.5px;line-height:19px;opacity:0;transition:opacity var(--t-out) var(--ease),transform 90ms linear;box-shadow:0 8px 20px rgba(30,20,24,.2)}
#tip.on{opacity:1}
#tip b{display:block;font-weight:600;margin-bottom:2px}
.tip-row{display:flex;align-items:center;gap:6px;font-family:var(--f-num)}
.tip-row i{width:8px;height:8px;border-radius:2px}
.tip-row span{margin-left:auto;padding-left:10px;font-weight:600}
.pop{position:fixed;z-index:120;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--pop-shadow);opacity:0;transform:scale(.96) translateY(-4px);transition:opacity var(--t-in) var(--ease),transform var(--t-in) var(--spring);max-height:min(520px,calc(100vh - 90px));overflow:auto}
.pop.open{opacity:1;transform:none}
.pop.closing{opacity:0;transform:scale(.97);transition-duration:var(--t-out)}
.pop-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;text-align:left;font-size:14px;transition:background-color 120ms}
.pop-item:hover,.pop-item.kb{background:var(--secondary)}
.pop-item .ic{color:var(--fg3)}
.pop-sep{height:1px;background:var(--border);margin:4px 0}
.modal-root{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity var(--t-in) var(--ease)}
.modal-root.open .scrim{opacity:1}
.modal{position:relative;background:#fff;border-radius:var(--r-panel);box-shadow:var(--pop-shadow);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(8px)}
.modal.in{transition:opacity var(--t-in) var(--ease),transform var(--t-in) var(--ease)}
.modal-root.open .modal{opacity:1;transform:none}
.modal.flip{transition:transform 320ms var(--ease),opacity 120ms linear,border-radius 320ms var(--ease)}
.modal.flip .modal-in{animation:fadeIn 220ms var(--ease) 140ms both}
.modal-root.closing .scrim{opacity:0;transition-duration:var(--t-out)}
.modal-root.closing .modal{opacity:0;transform:translateY(6px) scale(.99);transition:opacity var(--t-out) var(--ease),transform var(--t-out) var(--ease)}
.modal-in{display:flex;flex-direction:column;min-height:0;flex:1}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.modal-body{padding:0 20px 20px;overflow:auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--muted)}
.drawer-root{position:fixed;inset:0;z-index:190}
.drawer-root .scrim{background:rgba(30,20,24,.2)}
.drawer-root.open .scrim{opacity:1}
.drawer{position:absolute;top:16px;right:16px;bottom:16px;width:min(460px,calc(100vw - 32px));background:#fff;border-radius:var(--r-panel);box-shadow:var(--pop-shadow);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform 260ms var(--ease)}
.drawer-root.open .drawer{transform:none}
.drawer-root.closing .drawer{transform:translateX(calc(100% + 24px));transition-duration:180ms}
.drawer-root.closing .scrim{opacity:0}
#toasts{position:fixed;top:16px;right:16px;z-index:260;width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;pointer-events:none}
.toast-w{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-in) var(--ease),opacity var(--t-in) var(--ease);opacity:0}
.toast-w.in{grid-template-rows:1fr;opacity:1}
.toast-w>div{min-height:0;overflow:hidden}
.toast{pointer-events:auto;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:#fff;border:1px solid var(--border);box-shadow:var(--pop-shadow);transform:translateX(16px);transition:transform var(--t-in) var(--spring)}
.toast-w.in .toast{transform:none}
.toast .t-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none}
.toast.success .t-ic{background:var(--success-bg);color:var(--success)}
.toast.warning .t-ic{background:var(--warning-bg);color:var(--warning-text)}
.toast.error .t-ic{background:var(--danger-bg);color:var(--danger)}
.toast.info .t-ic{background:var(--brand-bg);color:var(--primary)}
.toast .t-bar{height:2px;background:var(--tint);border-radius:2px;margin-top:8px;transform-origin:left}
#progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:400;background:linear-gradient(90deg,var(--primary),var(--spark));opacity:0;transition:width .35s var(--ease),opacity .3s}
#progress.on{opacity:1}

/* =========================================================
   4. 인증 화면
   ========================================================= */
.auth{position:fixed;inset:0;padding:var(--gutter);display:flex;background:var(--bg)}
.auth-panel{flex:1;display:flex;background:#fff;border-radius:var(--r-panel);border:1px solid rgba(0,0,0,.03);box-shadow:var(--shadow);overflow:hidden;min-height:0}
.auth-brand{position:relative;flex:1.1;overflow:hidden;border-right:1px solid var(--border);background:linear-gradient(160deg,#F6F1F4,#EDE3E9 55%,#F8E3EA)}
.auth-brand canvas{position:absolute;inset:0;width:100%;height:100%}
.brand-in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:40px;gap:24px}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo-txt{display:flex;flex-direction:column;line-height:1}
.logo-txt b{font-family:var(--f-num);font-size:15px;letter-spacing:.06em;color:var(--fg)}
.logo-txt span{font-size:12px;color:var(--fg3);margin-top:3px}
.hero .display{font-size:38px;line-height:46px;letter-spacing:-.028em}
.reveal>span{display:block;overflow:hidden}
.reveal>span>span{display:block;animation:lineUp .7s var(--ease) both}
.reveal>span:nth-child(2)>span{animation-delay:.12s}
.hero p{margin-top:16px;max-width:460px;color:var(--fg2);font-size:15.5px;line-height:25px;animation:fadeUp .7s var(--ease) .3s both}
.hero-pts{display:flex;flex-direction:column;gap:10px;margin-top:22px;animation:fadeUp .7s var(--ease) .42s both}
.hero-pts div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg2)}
.hero-pts .pi{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--primary);backdrop-filter:blur(6px)}
.auth-form{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;overflow:auto}
.auth-view{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.auth-view.enter{animation:fadeUp .34s var(--ease) both}
.auth-links{display:flex;justify-content:center;gap:6px;font-size:14px;color:var(--fg3)}
.shake{animation:shake .38s var(--ease)}
.otp{display:flex;gap:8px}
.otp input{width:46px;height:50px;text-align:center;font-family:var(--f-num);font-size:20px;font-weight:600;border-radius:var(--r-sm);border:1px solid var(--border);outline:none;transition:border-color var(--t),box-shadow var(--t),transform 200ms var(--spring)}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.otp input.filled{transform:scale(1.06);border-color:var(--primary)}
.collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-in) var(--ease)}
.collapse.open{grid-template-rows:1fr}
.collapse>div{min-height:0;overflow:hidden}
.pw-meter{display:flex;gap:4px;margin-top:2px}
.pw-meter i{flex:1;height:4px;border-radius:2px;background:var(--secondary);transition:background-color var(--t-in)}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--success-bg);display:grid;place-items:center;margin:0 auto}
.done-ic path,.done-ic circle{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s var(--ease) .1s forwards}
.demo-acc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.demo-acc button{text-align:left;padding:8px 10px;border-radius:var(--r-sm);background:var(--muted);font-size:13px;line-height:18px;transition:background-color var(--t)}
.demo-acc button:hover{background:var(--tint-bg)}
.demo-acc b{font-family:var(--f-num);display:block;color:var(--fg)}
.auth.leaving{animation:blurOut .45s var(--ease) both}
.app.entering{animation:blurIn .55s var(--ease) both}
@media (max-width:959px){
  .auth-panel{flex-direction:column;overflow:auto}
  .auth-brand{flex:none;height:160px;border-right:0;border-bottom:1px solid var(--border)}
  .brand-in{padding:20px 22px;justify-content:center}
  .hero .display{font-size:24px;line-height:30px}
  .hero p,.hero-pts,.brand-foot,.brand-in>.logo{display:none}
  .auth-form{align-items:flex-start;padding:28px 20px}
}

/* =========================================================
   5. 앱 셸
   ========================================================= */
.app{position:fixed;inset:0;display:flex;gap:var(--gutter);padding:var(--gutter);background:var(--bg)}
.panel{background:#fff;border-radius:var(--r-panel);border:1px solid rgba(0,0,0,.03);box-shadow:var(--shadow)}
.sidebar{width:var(--sb);flex:none;display:flex;flex-direction:column;overflow:hidden;transition:width 200ms var(--ease)}
.app.collapsed .sidebar{width:var(--sb-c)}
.sb-top{height:var(--top);display:flex;align-items:center;padding:0 16px;flex:none}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;scrollbar-width:thin}
.sb-gh{display:flex;align-items:center;width:100%;height:32px;padding:0 8px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--fg3);border-radius:8px;letter-spacing:.01em}
.sb-gh:hover{color:var(--fg)}
.sb-gh .ic{margin-left:auto;transition:transform var(--t-in) var(--ease)}
.sb-group:not(.open) .sb-gh .ic{transform:rotate(-90deg)}
.sb-items{display:grid;grid-template-rows:1fr;transition:grid-template-rows var(--t-in) var(--ease)}
.sb-group:not(.open) .sb-items{grid-template-rows:0fr}
.sb-items>div{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.sb-item{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r-sm);font-size:14px;color:var(--fg2);white-space:nowrap;transition:background-color var(--t) var(--ease),color var(--t) var(--ease);width:100%;text-align:left}
.sb-item .ic{color:var(--fg3);transition:color var(--t)}
.sb-item:hover{background:var(--secondary);color:var(--fg)}
.sb-item:hover .ic{color:var(--primary)}
.sb-item.active{background:var(--tint-bg);color:var(--primary);font-weight:600}
.sb-item.active .ic{color:var(--primary)}
.sb-item.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);animation:indIn .26s var(--spring)}
.sb-label{overflow:hidden;text-overflow:ellipsis;transition:opacity var(--t)}
.sb-foot{padding:8px 10px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.app.collapsed .sb-gh{height:1px;margin:8px 6px;padding:0;overflow:hidden;background:var(--border);color:transparent;pointer-events:none}
.app.collapsed .sb-gh *{display:none}
.app.collapsed .sb-group .sb-items{grid-template-rows:1fr}
.app.collapsed .sb-item{justify-content:center;padding:0}
.app.collapsed .sb-label,.app.collapsed .sb-item .tag-new,.app.collapsed .logo-txt{opacity:0;width:0;position:absolute;pointer-events:none}
.app.collapsed .sb-top{padding:0 0 0 14px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:var(--top);flex:none;display:flex;align-items:center;gap:6px;padding:0 14px 0 20px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:6px;min-width:0;font-size:14px;color:var(--fg3)}
.crumb b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .ic{color:#C4B9BF}
.search{position:relative;width:260px}
.search .inp{height:36px;padding-left:34px;padding-right:44px;background:var(--muted);border-color:transparent;font-size:14px}
.search .inp:hover{border-color:var(--border)}
.search>.ic{position:absolute;left:11px;top:10px;color:var(--fg3)}
.search kbd{position:absolute;right:8px;top:8px;font-family:var(--f-num);font-size:11.5px;line-height:18px;padding:0 6px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--fg3)}
.bell-badge{position:absolute;top:-3px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;line-height:16px;font-weight:600;font-family:var(--f-num);text-align:center;border:2px solid #fff;box-sizing:content-box;transform-origin:center;transition:transform 260ms var(--spring)}
.bell-badge.bump{animation:bump .4s var(--spring)}
.icon-btn.ring-bell .ic{animation:bellRing .7s var(--ease);transform-origin:50% 10%}
.ai-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 9px;border-radius:999px;border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--fg);transition:background-color var(--t),border-color var(--t)}
.ai-btn:hover{background:var(--secondary)}
.ai-btn.on{background:var(--tint-bg);border-color:rgba(221,45,74,.3);color:var(--primary)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#880D1E,#F26A8D);color:#fff;font-size:13.5px;font-weight:600;display:grid;place-items:center;margin-left:4px}
.content{flex:1;overflow:auto;padding:22px 24px 32px;position:relative;scroll-behavior:smooth}
.page{min-width:0}
.page.page-in{animation:pageIn .3s var(--ease) both}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph-l{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
.ph-desc{font-size:14px;line-height:20px;color:var(--fg3);max-width:720px}
.ph-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rail{width:0;flex:none;overflow:hidden;transition:width var(--t-in) var(--ease),opacity var(--t-in);opacity:0;border-width:0}
.app.rail-open .rail{width:var(--rail);opacity:1;border-width:1px}
.rail-in{width:var(--rail);height:100%;display:flex;flex-direction:column}
.rail-h{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 12px 0 18px;border-bottom:1px solid var(--border);flex:none}
.mob-only{display:none}
.sb-scrim{display:none}
@media (max-width:1100px){.search{width:200px}}
@media (max-width:1023px){.app.rail-open .rail{position:fixed;right:16px;top:16px;bottom:16px;z-index:150;box-shadow:var(--pop-shadow)}}
@media (max-width:760px){
  .app{padding:10px;gap:10px}
  .sidebar{position:fixed;left:10px;top:10px;bottom:10px;z-index:160;width:var(--sb)!important;transform:translateX(calc(-100% - 20px));transition:transform 240ms var(--ease);box-shadow:var(--pop-shadow)}
  .app.mob-nav .sidebar{transform:none}

/* 덕반장 AI */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}

.chat-inner{max-width:760px;margin:0 auto;padding:12px 4px 24px;display:flex;flex-direction:column;gap:18px}
.chat-home{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:6vh}
.chat-home.leave{animation:fadeOut .2s var(--ease) both}
.brief-list{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
.brief{position:relative;display:flex;flex-direction:column;gap:4px;width:100%;padding:14px 48px 14px 16px;border-radius:var(--r);text-align:left;background:var(--muted);border:1px solid transparent;transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t) var(--ease)}

.msg{display:flex;gap:12px;animation:fadeUp .3s var(--ease) both}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--primary);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:80%;font-size:15px;line-height:24px}
.msg.ai .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:24px;color:var(--fg)}
.thinking{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg3)}
.thinking div{display:flex;align-items:center;gap:6px;animation:fadeUp .25s var(--ease) both}

.w{animation:wordIn .26s var(--ease) both}
.msg-tools{display:flex;gap:2px;animation:fadeIn .3s both}
.composer{flex:none;max-width:760px;width:100%;margin:0 auto;display:flex;align-items:flex-end;gap:6px;padding:8px 8px 8px 16px;border:1px solid var(--border);border-radius:16px;background:#fff;box-shadow:0 6px 20px rgba(136,13,30,.05);transition:border-color var(--t),box-shadow var(--t)}

.send{width:36px;height:36px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;transition:background-color var(--t),transform 80ms,opacity var(--t)}
.send:hover{background:var(--primary-h)}
.send:active{transform:scale(.94)}
.send[disabled]{opacity:.3;pointer-events:none}
.chat-page{height:calc(100vh - var(--top) - 32px - 54px);display:flex;flex-direction:column}
.rail .chat-inner{padding:14px 16px}
.rail .composer{margin:0 12px 12px;width:auto}
.src-chips{display:flex;gap:6px;flex-wrap:wrap}
/* 설비 매트릭스 */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.legend-row{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--fg2)}

.heat{display:grid;gap:3px;font-size:12.5px}

.perm td.c{padding:0}

.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}

function countTo(el,to){
  const dec=+el.dataset.dec||0;const from=parseFloat(el.dataset.v)||0;el.dataset.v=to;
  if(RM||from===to){el.textContent=nf(to,dec);return}
  const t0=performance.now();const D=400;
  const step=t=>{const p=Math.min(1,(t-t0)/D);const e=1-Math.pow(1-p,3);el.textContent=nf(from+(to-from)*e,dec);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ---------- 세그먼트·탭 결선 ---------- */
function placeInd(s,b,anim){
  const ind=$('.seg-ind',s);if(!ind||!b)return;
  const l=b.offsetLeft,w=b.offsetWidth;
  if(!anim||RM){ind.style.left=l+'px';ind.style.width=w+'px';return}
  const ol=parseFloat(ind.style.left)||l,ow=parseFloat(ind.style.width)||w;
  // 출발·도착 사이로 잠깐 늘어났다가 도착 폭으로 줄어듭니다 (gooey 의 pill pour 를 단순화)
  const L=Math.min(ol,l),R=Math.max(ol+ow,l+w);
  ind.style.left=L+'px';ind.style.width=(R-L)+'px';
  clearTimeout(s._t);s._t=setTimeout(()=>{ind.style.left=l+'px';ind.style.width=w+'px'},110);
}
function segSelect(s,i,emit=true){
  const bs=$$(':scope>button',s);const b=bs[i];if(!b)return;
  bs.forEach(x=>x.setAttribute('aria-selected',x===b));
  placeInd(s,b,true);
  if(emit)s.dispatchEvent(new CustomEvent('segchange',{detail:i}));
}
function wireSegs(root){
  $$('[data-seg]',root).forEach(s=>{
    if(s._w)return;s._w=1;
    const a=$(':scope>button[aria-selected="true"]',s)||$(':scope>button',s);
    requestAnimationFrame(()=>{placeInd(s,a,false);requestAnimationFrame(()=>s.classList.add('ready'))});
    s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.parentElement!==s||b.getAttribute('aria-selected')==='true')return;segSelect(s,+b.dataset.i)});
    s.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;const bs=$$(':scope>button',s);let i=bs.findIndex(x=>x.getAttribute('aria-selected')==='true');i=(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;segSelect(s,i);bs[i].focus()});
  });
}
addEventListener('resize',()=>$$('[data-seg].ready').forEach(s=>placeInd(s,$(':scope>button[aria-selected="true"]',s),false)));

/* ---------- 레이아웃 애니메이션(FLIP) ---------- */
function flip(container,mutate){
  const kids=[...container.children];const first=new Map(kids.map(k=>[k,k.getBoundingClientRect()]));
  mutate();
  if(RM)return;
  [...container.children].forEach(k=>{const f=first.get(k);if(!f)return;const l=k.getBoundingClientRect();const dx=f.left-l.left,dy=f.top-l.top;if(!dx&&!dy)return;
    k.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:160,easing:'cubic-bezier(.22,1,.36,1)'})});
}

let chartSeq=0;
function mountChart(el,draw){
  let lastW=el.clientWidth;
  const go=anim=>{el.innerHTML=draw(el.clientWidth||600);el.classList.toggle('anim',!!anim&&!RM)};
  go(true);
  const ro=new ResizeObserver(()=>{if(Math.abs(el.clientWidth-lastW)>4){lastW=el.clientWidth;go(false)}});
  ro.observe(el);onClean(()=>ro.disconnect());
  return {update(nd){
    // 데이터가 바뀌면 이전 모양에서 이어서 바뀝니다 (원본의 useDataChanged)
    draw=nd;const tmp=document.createElement('div');tmp.innerHTML=draw(el.clientWidth);
    const ks=$$('[data-k]',tmp);
    if(RM||!ks.length||!ks.every(n=>$(`[data-k="${n.dataset.k}"]`,el))){go(false);return}
    el.classList.remove('anim');
    ks.forEach(n=>{const o=$(`[data-k="${n.dataset.k}"]`,el);
      if(n.tagName.toLowerCase()==='path')o.style.d=`path("${n.getAttribute('d')}")`;
      else['y','height'].forEach(a=>{if(n.hasAttribute(a))o.style[a]=n.getAttribute(a)+'px'})});
    $$('[data-swap]',tmp).forEach(n=>{const o=$(`[data-swap="${n.dataset.swap}"]`,el);if(o)o.innerHTML=n.innerHTML});
  }};
}
function lineChart(o){const id=++chartSeq;return w=>{
  const h=o.h||220,L=o.padL||44,R=14,T=12,B=28,iw=Math.max(60,w-L-R),ih=h-T-B,n=o.labels.length;
  const all=o.series.flatMap(s=>s.data).concat(o.limit!=null?[o.limit]:[]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*.18||1;lo=o.min!=null?o.min:Math.max(0,lo-pad);hi=hi+pad;
  const x=i=>L+(n===1?iw/2:i*iw/(n-1)),y=v=>T+ih-(v-lo)/(hi-lo)*ih;const yf=o.yFmt||(v=>v.toFixed(1));
  let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v).toFixed(1);g+=`<line class="grid" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${+yy+4}" text-anchor="end">${yf(v)}</text>`}

  const cw=iw/Math.max(1,n-1);const vf=o.vFmt||(v=>v);
  const hits=o.labels.map((l,i)=>{const tip=`<b>${l}</b>`+o.series.map(s=>`<div class="tip-row"><i style="background:${s.color}"></i>${s.name}<span>${vf(s.data[i])}</span></div>`).join('');

  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||'선 차트'}"><defs><linearGradient id="lg${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${o.series[0].color}" stop-opacity=".16"/><stop offset="1" stop-color="${o.series[0].color}" stop-opacity="0"/></linearGradient></defs><g data-swap="axis">${g}</g>${ps}<g data-swap="hit">${hits}</g></svg>`;
}}
const niceMax=v=>{const p=Math.pow(10,Math.floor(Math.log10(v||1)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p};
function barChart(o){return w=>{
  const h=o.h||220,L=o.padL||44,R=o.pareto?42:14,T=12,B=28,iw=Math.max(60,w-L-R),ih=h-T-B,n=(o.data||o.series[0].data).length;
  const series=o.series||[{data:o.data,color:o.color}];const mx=niceMax(Math.max(...series.flatMap(s=>s.data))*1.08);
  const gw=iw/n,bw=Math.min(o.series?18:34,gw*(o.series?.32:.56)),xc=i=>L+gw*(i+.5),y=v=>T+ih-v/mx*ih;const yf=o.yFmt||nfk;
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=y(v).toFixed(1);g+=`<line class="grid" x1="${L}" x2="${w-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${+yy+4}" text-anchor="end">${yf(v)}</text>`;if(o.pareto)g+=`<text class="ax" x="${w-R+8}" y="${+yy+4}">${k*25}%</text>`}
  const every=Math.ceil(n/Math.max(2,Math.floor(iw/52)));
  o.labels.forEach((l,i)=>{if(i%every===0)g+=`<text class="ax" x="${xc(i)}" y="${h-8}" text-anchor="middle">${l}</text>`});
  const top=o.data?o.data.indexOf(Math.max(...o.data)):-1;let bars='';

    const fill=o.series?s.color:(o.hl&&i!==top?'var(--mute)':(s.color||'var(--primary)'));
    bars+=`<rect data-k="b${si}_${i}" class="bar" x="${(xc(i)+off-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(T+ih-y(v)).toFixed(1)}" rx="4" fill="${fill}" style="animation-delay:${i*28}ms"/>`}));
  let par='';

    par=`<path data-k="p" class="ln" pathLength="1" d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}" fill="none" stroke="var(--spark)" stroke-width="2"/>`+pts.map(p=>`<circle class="fade" cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="var(--spark)" stroke-width="2"/>`).join('')}

  return `<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||'막대 차트'}"><g data-swap="axis">${g}</g>${bars}${par}<g data-swap="hit">${hits}</g></svg>`;

function hbars(items,{fmt=nf,max}={}){const m=max||Math.max(...items.map(i=>i.v));
  return `<div class="hbars">${items.map((it,i)=>`<div class="hb-row" data-tip="${esc(`<b>${it.l}</b><div class="tip-row">${it.sub||''}<span>${fmt(it.v)}</span></div>`)}"><span class="hb-l">${it.l}</span><span class="hb-track"><span class="hb-fill" style="width:${(it.v/m*100).toFixed(1)}%;background:${it.c||'var(--primary)'};animation-delay:${i*40}ms"></span></span><span class="hb-v num-t">${fmt(it.v)}</span></div>`).join('')}</div>`}
function donut(items,{size=160,label='합계',fmt=nf,unit=''}={}){
  const tot=items.reduce((a,b)=>a+b.v,0);let acc=0;const r=15.9155;

function mountTable(host,cfg){

  const rowsAll=()=>{let r=cfg.rows.map((x,i)=>({...x,_i:i}));if(st.sort!=null){const c=cols[st.sort];r.sort((a,b)=>{const va=a[c.key],vb=b[c.key];return (typeof va==='number'?va-vb:String(va).localeCompare(String(vb),'ko'))*st.dir})}return r};
  const pages=()=>Math.max(1,Math.ceil(cfg.rows.length/st.size));
  host.innerHTML=`<div class="tbl"><div class="tbl-scroll" style="max-height:${cfg.maxH||540}px"><table style="width:max(100%,${W}px)"><colgroup>${cfg.select?'<col style="width:44px">':''}${cols.map(c=>`<col style="width:${c.w||120}px">`).join('')}</colgroup><thead><tr>${cfg.select?`<th class="sel ${cfg.stickyFirst?'sticky-l':''}">${chk('',false,{attrs:'data-all aria-label="전체 선택"'})}</th>`:''}${cols.map((c,i)=>`<th class="${c.num?'r':c.center?'c':''} ${c.sort===false?'':'sortable'} ${cfg.stickyFirst&&i===0&&!cfg.select?'sticky-l':''}" data-i="${i}" ${c.sort===false?'':'tabindex="0"'}><span class="th-in">${c.title}${c.sort===false?'':`<span class="sort-ic">${ic('arrowUp',13,2)}</span>`}</span></th>`).join('')}</tr></thead><tbody></tbody></table></div>${cfg.noFoot?'':`<div class="tbl-foot"><span class="t-sm fg3">총 <b class="num-t" style="color:var(--fg)">${nf(cfg.rows.length)}</b>건</span><span class="t-sm brand sel-info"></span><div class="pager">${pages()>1?iconBtn('chevronLeft','이전 페이지',{attrs:'data-prev'})+seg([...Array(pages())].map((_,i)=>i+1),0,{cls:'sm',label:'페이지'})+iconBtn('chevronRight','다음 페이지',{attrs:'data-next'}):''}</div></div>`}</div>`;
  const tb=$('tbody',host);
  const render=()=>{const r=rowsAll().slice(st.page*st.size,(st.page+1)*st.size);
    tb.innerHTML=r.length?r.map(row=>`<tr data-r="${row._i}" class="${st.sel.has(row._i)?'is-sel':''} ${cfg.onRow?'clickable':''}">${cfg.select?`<td class="sel ${cfg.stickyFirst?'sticky-l':''}">${chk('',st.sel.has(row._i),{attrs:`data-rs="${row._i}" aria-label="행 선택"`})}</td>`:''}${cols.map((c,i)=>{const v=row[c.key];const h=c.fmt?c.fmt(v,row):c.num&&typeof v==='number'?nf(v,c.dec||0):(v==null?'—':esc(v));return `<td class="${c.num?'r num-c':c.center?'c':''} ${cfg.stickyFirst&&i===0&&!cfg.select?'sticky-l':''}" title="${typeof h==='string'&&!h.includes('<')?h:''}">${h}</td>`}).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length+(cfg.select?1:0)}" style="height:auto;padding:0">${empty()}</td></tr>`;
    const si=$('.sel-info',host);if(si)si.textContent=st.sel.size?`· ${st.sel.size}건 선택`:'';
  };

  $$('th.sortable',host).forEach(th=>{const go=()=>{const i=+th.dataset.i;if(st.sort===i)st.dir*=-1;else{st.sort=i;st.dir=1}
    $$('th',host).forEach(x=>x.classList.remove('sorted','desc'));th.classList.add('sorted');if(st.dir<0)th.classList.add('desc');render()};
    th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
  const sg=$('.pager [data-seg]',host);
  if(sg){sg.addEventListener('segchange',e=>{st.page=e.detail;render();$('.tbl-scroll',host).scrollTop=0});
    $('[data-prev]',host).onclick=()=>st.page>0&&segSelect(sg,st.page-1);
    $('[data-next]',host).onclick=()=>st.page<pages()-1&&segSelect(sg,st.page+1)}
  host.addEventListener('change',e=>{const t=e.target;
    if(t.matches('[data-all]')){cfg.rows.forEach((_,i)=>t.checked?st.sel.add(i):st.sel.delete(i));render()}
    if(t.matches('[data-rs]')){const i=+t.dataset.rs;t.checked?st.sel.add(i):st.sel.delete(i);t.closest('tr').classList.toggle('is-sel',t.checked);const si=$('.sel-info',host);if(si)si.textContent=st.sel.size?`· ${st.sel.size}건 선택`:''}});

  return {setRows(r){cfg.rows=r;st.page=0;render()}};
}

  float n(vec2 u){return sin(u.x*2.3+t*.13)*.5+sin(u.y*3.1-t*.11)*.5+sin((u.x+u.y)*1.7+t*.08)*.5;}

  vec3 col=mix(c0,c1,smoothstep(.0,1.,u.y*.8+.2));col=mix(col,c2,smoothstep(.62,.98,a)*.55);col=mix(col,c3,smoothstep(.86,1.04,a)*.22);
  gl_FragColor=vec4(col,1.);}`;
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s};
  glProg=gl.createProgram();gl.attachShader(glProg,sh(gl.VERTEX_SHADER,vs));gl.attachShader(glProg,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(glProg);
  if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)){gl=null;return}
  gl.useProgram(glProg);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(glProg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  glU={r:gl.getUniformLocation(glProg,'r'),t:gl.getUniformLocation(glProg,'t')};
}
let pts=[];const mouse={x:-999,y:-999};
function startBrand(){
  if(brandRaf)return;const sc=$('#shader'),cc=$('#constel');const ctx=cc.getContext('2d');
  if(!gl&&!glProg)initShader();
  const box=$('.auth-brand');box.onpointermove=e=>{const r=box.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top};box.onpointerleave=()=>{mouse.x=mouse.y=-999};
  const size=()=>{const r=box.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);[sc,cc].forEach(c=>{c.width=r.width*dpr;c.height=r.height*dpr});ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(r.width*r.height/9000);pts=[...Array(Math.min(90,n))].map(()=>({x:Math.random()*r.width,y:Math.random()*r.height,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,s:Math.random()<.18}))};
  size();box._ro=new ResizeObserver(size);box._ro.observe(box);
  const t0=performance.now();
  const frame=t=>{const r=box.getBoundingClientRect();const W=r.width,H=r.height;
    if(gl){gl.viewport(0,0,sc.width,sc.height);gl.uniform2f(glU.r,sc.width,sc.height);gl.uniform1f(glU.t,(t-t0)/1000*(RM?0:1));gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{if(!RM){p.x+=p.vx;p.y+=p.vy}const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);if(d<140&&!RM){p.x+=dx*.004;p.y+=dy*.004}if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<110){ctx.strokeStyle=`rgba(136,13,30,${(1-d/110)*.16})`;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
    pts.forEach(p=>{ctx.fillStyle=p.s?'rgba(242,106,141,.85)':'rgba(136,13,30,.32)';ctx.beginPath();ctx.arc(p.x,p.y,p.s?2.4:1.6,0,7);ctx.fill()});
    brandRaf=requestAnimationFrame(frame)};
  brandRaf=requestAnimationFrame(frame);
}
function stopBrand(){if(brandRaf)cancelAnimationFrame(brandRaf);brandRaf=0;const b=$('.auth-brand');b&&b._ro&&b._ro.disconnect()}
