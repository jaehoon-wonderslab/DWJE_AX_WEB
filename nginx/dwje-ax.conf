# =====================================================================================
#  덕우전자 AX 시스템 — Ubuntu Nginx 운영 환경 배포 설정 (권장)
#
#  배치 위치: /etc/nginx/sites-available/dwje-ax
#  심볼릭 링크: sudo ln -s /etc/nginx/sites-available/dwje-ax /etc/nginx/sites-enabled/
#  검증 및 반영: sudo nginx -t && sudo systemctl reload nginx
# =====================================================================================

server {
    listen 80;
    server_name _; # 운영 도메인 또는 서버 IP (예: ax.dwje.co.kr)

    # 1. 정적 웹 프론트엔드 (Expo Web 빌드 산출물 dist/)
    root /opt/dwje/web/dist;
    index index.html;

    # Gzip 압축 설정
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # 2. 백엔드 Spring Boot API 리버스 프록시 (:8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 및 연결 유지
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 파일 업로드(엑셀 대용량 등) 허용 용량
        client_max_body_size 50M;

        # 타임아웃 설정 (AI 생성 등 긴 요청 대비)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 3. 해시된 정적 에셋 장기 캐싱 (_expo/static/)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. SPA 라우팅 지원 (HTML5 History API)
    # 정적 파일이 있으면 서빙하고, 없으면 .html 시도, 최종 fallback은 index.html
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
